# Awesome Skills - Quality Check CI/CD Workflow
#
# This workflow runs comprehensive quality checks on skill files:
# 1. YAML/Markdown linting
# 2. Structure validation
# 3. Quality scoring (8 dimensions, including content efficiency & token cost)
# 4. Token budget check (with API cost estimation)
# 5. Anti-pattern scanning
# 6. Quality Gate — blocks PRs that fall below quality thresholds (NEW)

name: Skill Quality Check

on:
  push:
    branches: ["**"]
    paths:
      - "skills/**"
      - "tools/**"
      - ".github/scripts/**"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "skills/**"
      - "tools/**"
      - ".github/scripts/**"

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Job 1: Lint (YAML + Markdown)
  lint:
    name: Lint Skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: |
          pip install yamllint
          npm install -g markdownlint-cli

      - name: Lint YAML
        run: yamllint -c .yamllint .

      - name: Lint changed Markdown
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi

          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(
            git diff --name-only --diff-filter=ACMR -z \
              "$base" HEAD -- "skills/**/*.md"
          )

          if (( ${#files[@]} == 0 )); then
            echo "No changed skill Markdown files."
            exit 0
          fi

          markdownlint -c .markdownlint.json "${files[@]}"

  # Job 2: Structure Validation
  validate:
    name: Validate Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml rich jsonschema

      - name: Validate frontmatter schema (JSON Schema)
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          schema_path = Path("schema/frontmatter.schema.json")
          if schema_path.exists():
              schema = json.loads(schema_path.read_text())
              field_count = len(schema.get("properties", {}))
              print(f"Schema loaded: {schema['title']} ({field_count} fields)")
          else:
              print(
                  "WARNING: schema/frontmatter.schema.json not found",
                  file=sys.stderr,
              )
          PY

      - name: Validate changed skills
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi

          files=()
          while IFS= read -r -d '' file; do
            filename="$(basename "$file")"
            if [[ "$filename" == "SKILL.md" ]]; then
              files+=("$file")
              continue
            fi

            case "$filename" in
              README.md | PROFILE_NOTES.md | EVALUATION_REPORT.md | \
                RESTORATION_REPORT.md | CHANGELOG.md)
                continue
                ;;
            esac

            directory="$(dirname "$file")"
            bundled_reference=false
            while [[ "$directory" != "skills" && "$directory" != "." ]]; do
              if [[ -f "$directory/SKILL.md" ]]; then
                bundled_reference=true
                break
              fi
              directory="$(dirname "$directory")"
            done

            if [[ "$bundled_reference" == false ]]; then
              files+=("$file")
            fi
          done < <(
            git diff --name-only --diff-filter=ACMR -z \
              "$base" HEAD -- "skills/**/*.md"
          )

          if (( ${#files[@]} == 0 )); then
            echo "No changed skill entrypoints."
            exit 0
          fi

          python3 .github/scripts/validate_skills.py "${files[@]}"

      - name: Taxonomy consistency check
        run: python3 scripts/check_taxonomy.py

      - name: Catalog is in sync with skills/
        run: python3 scripts/regenerate_catalog.py --check

      - name: SKILL.md length budget (informational)
        run: python3 scripts/skill_length_check.py --warn 300 --fail 800
        continue-on-error: true

  # Job 3: Quality Analysis (informational — always runs, does not block)
  quality:
    name: Quality Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install tools
        run: pip install -e ./tools/

      - name: Run quality scoring (8 dimensions)
        run: python -m tools.skill_analyzer.cli score --output json > scores.json
        continue-on-error: true

      - name: Run token budget check (with cost estimation)
        run: python -m tools.skill_analyzer.cli tokenizer --output json > tokens.json
        continue-on-error: true

      - name: Run anti-pattern scan
        run: python -m tools.skill_analyzer.cli antipattern --output json > antipatterns.json
        continue-on-error: true

      - name: Run description-similarity linter (informational)
        run: |
          python3 scripts/description_linter.py \
            --threshold 0.6 \
            --format json \
            --output description_overlap.json
        continue-on-error: true

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-analysis
          path: |
            scores.json
            tokens.json
            antipatterns.json
            description_overlap.json
          retention-days: 7

  # Job 4: Quality Gate (BLOCKING — fails PR if quality thresholds not met)
  quality-gate:
    name: Quality Gate (Blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: validate  # run after structure validation passes

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install tools
        run: pip install -e ./tools/

      - name: Identify changed skill files
        id: changed
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed="$(
            git diff --name-only --diff-filter=ACMR \
              "$base" HEAD -- "skills/**/SKILL.md"
          )"
          count="$(printf '%s\n' "$changed" | grep -c . || true)"

          {
            echo "files<<EOF"
            printf '%s\n' "$changed"
            echo "EOF"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

      - name: Run quality gate on changed skills
        if: steps.changed.outputs.count != '0'
        run: |
          echo "${{ steps.changed.outputs.files }}" | \
            python3 .github/scripts/quality_gate.py --stdin \
              --min-score 4.0 \
              --max-tokens 6000 \
              --max-desc-chars 400

      - name: No skill files changed
        if: steps.changed.outputs.count == '0'
        run: echo "No SKILL.md files changed — quality gate skipped."

  # Job 5: Dashboard (main branch only)
  dashboard:
    name: Update Dashboard
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: pip install -e ./tools/

      - name: Generate dashboard
        run: python -m tools.progress_tracker.dashboard --output json --path reports/dashboard.json || true

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-dashboard
          path: reports/
          retention-days: 30
